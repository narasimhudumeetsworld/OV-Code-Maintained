# Model Configuration
# Settings for different AI models

# Available models
models:
  openai:
    gpt-4:
      name: "gpt-4"
      provider: "openai"
      max_tokens: 8192
      default_temperature: 0.7
      supports_functions: true
      cost_per_1k_input: 0.03
      cost_per_1k_output: 0.06
      
    gpt-4-turbo:
      name: "gpt-4-turbo-preview"
      provider: "openai"
      max_tokens: 128000
      default_temperature: 0.7
      supports_functions: true
      cost_per_1k_input: 0.01
      cost_per_1k_output: 0.03
      
    gpt-3.5-turbo:
      name: "gpt-3.5-turbo"
      provider: "openai"
      max_tokens: 16385
      default_temperature: 0.7
      supports_functions: true
      cost_per_1k_input: 0.0005
      cost_per_1k_output: 0.0015

  anthropic:
    claude-3-opus:
      name: "claude-3-opus-20240229"
      provider: "anthropic"
      max_tokens: 200000
      default_temperature: 0.7
      supports_functions: false
      cost_per_1k_input: 0.015
      cost_per_1k_output: 0.075
      
    claude-3-sonnet:
      name: "claude-3-sonnet-20240229"
      provider: "anthropic"
      max_tokens: 200000
      default_temperature: 0.7
      supports_functions: false
      cost_per_1k_input: 0.003
      cost_per_1k_output: 0.015
      
    claude-3-haiku:
      name: "claude-3-haiku-20240307"
      provider: "anthropic"
      max_tokens: 200000
      default_temperature: 0.7
      supports_functions: false
      cost_per_1k_input: 0.00025
      cost_per_1k_output: 0.00125

# Default configuration
defaults:
  model: "gpt-4"
  temperature: 0.7
  max_tokens: 4096
  timeout: 60  # seconds
  retry_attempts: 3
  retry_delay: 1  # seconds

# Rate limiting
rate_limits:
  requests_per_minute: 60
  tokens_per_minute: 90000
  concurrent_requests: 5

# Caching
cache:
  enabled: true
  ttl: 3600  # seconds
  max_size: 1000  # entries

# Logging
logging:
  log_requests: true
  log_responses: true
  log_tokens: true
  log_costs: true
