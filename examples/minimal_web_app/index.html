<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OV-Code Demo - Task Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            padding: 20px 0;
        }
        
        header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        
        header p {
            opacity: 0.9;
        }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-top: 20px;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e1e5eb;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .task-list {
            list-style: none;
        }
        
        .task-item {
            display: flex;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid #e1e5eb;
            transition: background-color 0.2s;
        }
        
        .task-item:last-child {
            border-bottom: none;
        }
        
        .task-item:hover {
            background-color: #f7f9fc;
        }
        
        .task-item.completed .task-text {
            text-decoration: line-through;
            opacity: 0.5;
        }
        
        .task-checkbox {
            width: 24px;
            height: 24px;
            margin-right: 16px;
            cursor: pointer;
            accent-color: #667eea;
        }
        
        .task-text {
            flex: 1;
            font-size: 1rem;
        }
        
        .task-delete {
            background: #ff4757;
            padding: 8px 12px;
            font-size: 0.875rem;
        }
        
        .task-delete:hover {
            background: #ff3344;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .stats {
            display: flex;
            justify-content: space-between;
            padding: 16px;
            background: #f7f9fc;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 0.875rem;
            color: #666;
        }
        
        footer {
            text-align: center;
            color: white;
            padding: 20px;
            opacity: 0.8;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🕉️ OV-Code Task Manager</h1>
            <p>A minimal example built with AI best practices</p>
        </header>
        
        <div class="card">
            <div class="input-group">
                <input 
                    type="text" 
                    id="taskInput" 
                    placeholder="What needs to be done?"
                    aria-label="New task input"
                >
                <button onclick="addTask()" aria-label="Add task">Add</button>
            </div>
            
            <ul class="task-list" id="taskList" aria-label="Task list">
                <!-- Tasks will be inserted here -->
            </ul>
            
            <div class="stats" id="stats">
                <span id="totalTasks">0 tasks</span>
                <span id="completedTasks">0 completed</span>
            </div>
        </div>
        
        <footer>
            <p>Built with OV-Code-Maintained | Om Vinayaka 🙏</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
